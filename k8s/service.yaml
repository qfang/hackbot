apiVersion: v1
kind: Service
metadata:
  name: hackbot
  labels:
    app: hackbot
spec:
  type: ClusterIP
  selector:
    app: hackbot
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  # Session affinity for better cache utilization
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
